<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f0d"><title>My Account · Sai Saravana Turf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#0b0f0d;--panel:#111713;--bone:#ece8de;--mut:#8a948c;--line:rgba(236,232,222,.15);--red:#e8412c;--d:"Barlow Condensed","Arial Narrow",Impact,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--bone);font:400 15px/1.55 Barlow,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2))}.logo{font:800 22px var(--d);letter-spacing:.1em;text-transform:uppercase}.logo i{font-style:normal;color:var(--red)}.top a:last-child{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#bdc4bc}
main{width:min(1180px,calc(100% - 40px));margin:42px auto 90px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}h1{font:800 clamp(48px,7vw,82px)/.9 var(--d);text-transform:uppercase;margin:12px 0 28px}h1 em{font-style:normal;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px}.stat small{display:block;color:var(--mut);font-size:11px;letter-spacing:.15em;text-transform:uppercase}.stat b{display:block;font:700 34px var(--d);margin-top:5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 14px}.tab{border:1px solid var(--line);background:transparent;color:var(--bone);padding:10px 16px;border-radius:3px;font:600 11px Barlow;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}.tab.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.list{display:grid;gap:10px}.booking{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.booking h3{font:700 24px var(--d);text-transform:uppercase;margin:0 0 6px}.meta{display:flex;gap:8px 18px;flex-wrap:wrap;color:#b2bbb3;font-size:13px}.status{display:inline-block;border:1px solid rgba(236,232,222,.2);padding:5px 9px;border-radius:2px;color:#e7c995;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{display:inline-flex;justify-content:center;align-items:center;border:1px solid var(--red);background:var(--red);color:#fff;padding:11px 14px;border-radius:2px;font:700 11px Barlow;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.btn.out{background:transparent;border-color:rgba(236,232,222,.35);color:var(--bone)}.empty{padding:36px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--bone);font:700 24px var(--d);text-transform:uppercase;margin-bottom:6px}
.profile{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.profile label{display:block;color:var(--mut);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.profile b{display:block;margin-top:6px;font-size:16px;overflow-wrap:anywhere}
.notice{padding:14px 16px;border:1px solid rgba(232,65,44,.45);background:rgba(232,65,44,.07);color:#f0b4aa;border-radius:3px;margin-bottom:18px;font-size:13px}.loading{color:var(--mut);padding:30px}.foot{border-top:1px solid var(--line);padding:22px max(22px,calc((100vw - 1180px)/2));color:var(--mut);font-size:12px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.booking{grid-template-columns:1fr}.actions{justify-content:flex-start}.profile{grid-template-columns:1fr}.stat,.card{padding:16px}}
</style></head><body>
<header class="top"><a class="logo" href="/">Sai Saravana <i>Turf</i></a><a href="/" id="back">Back to website</a></header>
<main><div class="eyebrow">Customer account</div><h1>Good to see you <em id="firstName">again.</em></h1><div class="notice" id="notice" hidden></div>
<div class="stats"><div class="stat"><small>Upcoming bookings</small><b id="upcoming">—</b></div><div class="stat"><small>Completed bookings</small><b id="completed">—</b></div><div class="stat"><small>Tickets available</small><b id="tickets">—</b></div></div>
<div class="tabs" role="tablist"><button class="tab on" data-tab="upcoming">Upcoming</button><button class="tab" data-tab="past">Past bookings</button><button class="tab" data-tab="profile">My profile</button></div>
<section id="content" class="list"><div class="loading">Loading your account…</div></section>
</main><footer class="foot">© 2026 Sai Saravana Turf · Customer account</footer>
<script>
(function(){
const API="/api/customer",content=document.getElementById("content"),notice=document.getElementById("notice");let current="upcoming",profile=null;
async function req(path,opt){opt=opt||{};const r=await fetch(API+path,{method:opt.method||"GET",credentials:"include",headers:{"Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined});const data=await r.json().catch(()=>({}));if(r.status===401){location.href="/login/";throw new Error("Please sign in again.")}if(!r.ok)throw new Error(data.message||"Could not load account data.");return data}
function esc(s){return String(s==null?"—":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ru(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function showError(e){notice.hidden=false;notice.textContent=e.message||"The customer account service is not connected yet.";content.innerHTML='<div class="card empty"><b>Account unavailable</b>'+esc(e.message||"Please try again later.")+'</div>'}
function renderBookings(items){if(!items||!items.length){content.innerHTML='<div class="card empty"><b>No bookings here yet</b>Your bookings will appear here after you make a reservation.<p><a class="btn" href="/#book">Book a slot</a></p></div>';return}
content.innerHTML=items.map(b=>'<article class="card booking"><div><h3>'+esc(b.sport||b.ground)+'</h3><div class="meta"><span>'+esc(b.bookingId||b.id)+'</span><span>'+esc(b.dateLabel||b.date)+'</span><span>'+esc(b.timeLabel||b.slot)+'</span><span>'+ru(b.totalAmount||b.amount)+'</span></div><span class="status">'+esc(b.status)+'</span></div><div class="actions"><button class="btn out" data-ticket="'+esc(b.bookingId||b.id)+'">View ticket</button></div></article>').join("")}
async function load(tab){current=tab;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));if(tab==="profile"){renderProfile();return}content.innerHTML='<div class="loading">Loading bookings…</div>';try{const d=await req("/bookings?scope="+encodeURIComponent(tab));renderBookings(d.items||d.bookings||[])}catch(e){showError(e)}}
function renderProfile(){if(!profile){content.innerHTML='<div class="loading">Loading profile…</div>';return}content.innerHTML='<div class="card profile"><div><label>Name</label><b>'+esc(profile.name)+'</b></div><div><label>Mobile</label><b>'+esc(profile.phone)+'</b></div><div><label>Email</label><b>'+esc(profile.email||"Not added")+'</b></div><div><label>Member since</label><b>'+esc(profile.memberSince||"—")+'</b></div></div>'}
async function init(){try{const d=await req("/auth/me");profile=d.user||d;document.getElementById("firstName").textContent=(profile.name||"again").split(" ")[0]+".";const s=await req("/bookings/summary");document.getElementById("upcoming").textContent=s.upcomingCount??"—";document.getElementById("completed").textContent=s.completedCount??"—";document.getElementById("tickets").textContent=s.ticketCount??"—";await load("upcoming")}catch(e){showError(e)}}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>load(b.dataset.tab)));
content.addEventListener("click",async e=>{const b=e.target.closest("[data-ticket]");if(!b)return;try{const d=await req("/bookings/"+encodeURIComponent(b.dataset.ticket)+"/ticket");if(d.ticketUrl)window.open(d.ticketUrl,"_blank","noopener");else if(d.qrPayload){const w=window.open("","_blank","noopener");if(w)w.document.write("<title>Booking ticket</title><pre>"+esc(d.qrPayload)+"</pre>")}else notice.textContent="Ticket details are not available yet."}catch(x){notice.hidden=false;notice.textContent=x.message}});
init();
})();
</script></body></html>
